<body>
  <div class="app-wrapper">
    <div class="container py-4">
      <h1 class="mb-4 text-center">My Movies</h1>

      <div class="card p-3 mb-4 search-card">
        <div class="row g-2">
          <div class="col-md-4">
               <label class="form-label">Search Movie</label>
            <input id="search" class="form-control" placeholder="Search title..." />
          </div>
         <div class="col-md-2">
              <label class="form-label">Year</label>
              <select id="year" class="form-select">
                <option value="">All</option>
              </select>
         </div>
          <div class="col-md-3">
               <label class="form-label">Rating</label>
            <input id="rating" type="number" step="0.1" class="form-control" placeholder="Min rating" />
          </div>
          <div class="col-md-3">
            <button id="btnSearch"  class="btn btn-primary">Search</button>
          </div>
        </div>
      </div>

      <div id="movies" class="row g-3"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
